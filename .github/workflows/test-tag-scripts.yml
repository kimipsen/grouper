name: Test Tag Scripts

on:
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/**'
      - '.github/workflows/test-tag-scripts.yml'

permissions:
  contents: read

env:
  # Pinned actionlint release; the SHA-256 is that of the linux_amd64 tarball published in
  # the release's actionlint_<version>_checksums.txt. Update both together.
  ACTIONLINT_VERSION: '1.7.12'
  ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run tagging script tests
        run: bash .github/scripts/test-version-lib.sh

      - name: Install actionlint
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"

      - name: Lint tagging workflows
        run: >-
          actionlint
          .github/workflows/tag-dependabot-merges.yml
          .github/workflows/test-tag-scripts.yml
