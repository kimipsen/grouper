# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for more information:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
# https://containers.dev/guide/dependabot

version: 2
updates:
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: cron
      cronjob: "0 6 * * 1,3,5"
      timezone: "Europe/Copenhagen"
    labels:
      - "mergequeue"
    assignees:
      - "kimipsen"
  - package-ecosystem: "npm"
    directory: "/grouper-app"
    schedule:
      interval: cron
      cronjob: "0 6 * * 1,3,5"
      timezone: "Europe/Copenhagen"
    # Vitest packages pin each other's exact version as a peer, so they must
    # be bumped in the same PR or npm ci fails with ERESOLVE.
    groups:
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      # Angular packages are released in lockstep and share peer ranges.
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "@schematics/angular"
          - "angular-eslint"
          - "@angular-eslint/*"
    labels:
      - "mergequeue"
    assignees:
      - "kimipsen"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: cron
      cronjob: "0 6 * * 1,3,5"
      timezone: "Europe/Copenhagen"
    labels:
      - "mergequeue"
    assignees:
      - "kimipsen"
